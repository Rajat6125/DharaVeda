<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DharaVeda - Disease Detection</title>
    <link rel="icon" href="Pic/0Logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --text-primary: #1E2A1F;
            --text-secondary: #555555;
            --accent-green: #3B6B3F;
            --font-family: 'Outfit', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { height:100%; height:100dvh; }
        body {
            font-family: var(--font-family);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            background-color: #f4f4f4;
            overflow: hidden;
        }
        body::before {
            content:'';
            position:fixed; top:0; left:0; width:100%; height:100%;
            background-image: url('Pic/Wall1.jpg');
            background-size:cover; background-position:center;
            z-index:-1;
        }
        .app-container {
            width:100%; max-width:480px;
            height:100vh; height:100dvh;
            position:relative; display:flex; flex-direction:column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .top-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:16px 20px;
            background: rgba(255,255,255,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            z-index:10; flex-shrink:0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom-left-radius:20px; border-bottom-right-radius:20px;
        }
        .header-left { display:flex; align-items:center; gap:12px; }
        .header-info h2 { font-size:18px; font-weight:700; color:var(--accent-green); }
        .header-info p { font-size:12px; color:var(--text-secondary); }
        .header-btn { background:none; border:none; font-size:18px; color:var(--text-secondary); cursor:pointer; }
        .main-content {
            flex:1; min-height:0; overflow-y:auto;
            -webkit-overflow-scrolling:touch;
            padding:20px;
            display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth;
        }
        .main-content::-webkit-scrollbar { width:6px; }
        .main-content::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.1); border-radius:10px; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        /* ── Upload card ─────────────────────────────────────── */
        .upload-card {
            background:rgba(240,248,241,0.95); border-radius:20px; padding:20px;
            box-shadow:0 4px 15px rgba(0,0,0,0.05); border:1px solid rgba(255,255,255,0.5);
            animation:fadeIn 0.3s ease;
        }
        .upload-card h3 { font-size:15px; color:var(--accent-green); display:flex; align-items:center; gap:8px; margin-bottom:4px; font-weight:700; }
        .upload-card p { font-size:12px; color:var(--text-secondary); margin-bottom:14px; }
        .upload-area {
            border:2px dashed rgba(59,107,63,0.35);
            border-radius:14px; padding:36px 20px;
            background:white; cursor:pointer;
            transition:all 0.3s; text-align:center;
        }
        .upload-area:hover, .upload-area.drag-over { border-color:var(--accent-green); background:#f8fff8; }
        .upload-area i { font-size:36px; color:var(--accent-green); margin-bottom:10px; display:block; }
        .upload-area p { font-size:13px; color:var(--text-secondary); font-weight:500; margin-bottom:0; }

        /* ── Diagnosis result card (compact) ─────────────────── */
        .diag-card {
            background: linear-gradient(145deg, #ffffff, #f5fbf5);
            border-radius: 18px; padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(59,107,63,0.12);
            animation: fadeIn 0.4s ease;
        }
        .diag-row { display:flex; gap:14px; align-items:center; }
        .diag-img {
            flex:0 0 90px; width:90px; height:90px;
            border-radius:12px; overflow:hidden;
            box-shadow:0 3px 10px rgba(0,0,0,0.15);
            border:2px solid rgba(59,107,63,0.2);
        }
        .diag-img img { width:100%; height:100%; object-fit:cover; display:block; }
        .diag-info { flex:1; min-width:0; }
        .diag-label { font-size:10px; color:#777; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px; }
        .diag-name { font-size:15px; font-weight:800; color:#1a4d2e; line-height:1.3; margin-bottom:8px; word-break:break-word; }
        .diag-bar-track { background:#e9ecef; border-radius:12px; height:9px; overflow:hidden; margin-bottom:3px; }
        .diag-bar-fill { height:100%; border-radius:12px; transition:width 1s ease; }
        .diag-pct { font-size:10px; font-weight:800; text-align:right; display:block; }
        .diag-footer { font-size:10px; color:#aaa; margin-top:10px; display:flex; align-items:center; gap:5px; }

        /* ── Chat bubbles ─────────────────────────────────────── */
        .bubble-row { display:flex; gap:10px; align-items:flex-end; animation:fadeIn 0.3s ease; }
        .bubble-row.user { justify-content:flex-end; }
        .avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; align-self:flex-start; margin-top:2px; }
        .avatar-spacer { width:32px; flex-shrink:0; }
        .bubble {
            padding:10px 14px; border-radius:18px;
            font-size:13px; line-height:1.6; max-width:82%;
            box-shadow:0 2px 6px rgba(0,0,0,0.06);
        }
        .bubble.bot {
            background:white; color:var(--text-primary);
            border-top-left-radius:4px;
        }
        .bubble.user {
            background:#FDE047; color:var(--text-primary);
            border-top-right-radius:4px;
        }
        /* image bubble from user */
        .bubble.user-img {
            background:#FDE047; padding:6px;
            border-top-right-radius:4px;
        }
        .bubble.user-img img {
            width:160px; height:160px; object-fit:cover;
            border-radius:12px; display:block;
        }

        /* ── Chat input bar ──────────────────────────────────── */
        #chat-input-bar {
            display:flex; align-items:center; gap:10px;
            padding:12px 16px 14px;
            flex-shrink:0;
        }
        #chat-input-wrap {
            flex:1; display:flex; align-items:center; gap:8px;
            background:rgba(30,42,31,0.85);
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
            border:1px solid rgba(255,255,255,0.15);
            border-radius:28px; padding:10px 16px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15); transition:all 0.2s;
        }
        #chat-input-wrap:focus-within { border-color:#4ade80; box-shadow:0 0 0 3px rgba(74,222,128,0.2); }
        #chat-input-wrap .leaf-icon { font-size:14px; color:#4ade80; opacity:0.9; flex-shrink:0; }
        #chat-input {
            flex:1; border:none; background:transparent; font-size:13px;
            font-family:var(--font-family); outline:none; color:#fff; min-width:0;
        }
        #chat-input::placeholder { color:rgba(255,255,255,0.55); }
        #chat-input:disabled { cursor:not-allowed; }
        #send-btn {
            width:42px; height:42px; border-radius:50%; border:none;
            background:#1E2A1F; color:#4ade80; font-size:15px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            transition:background 0.2s,transform 0.1s,box-shadow 0.2s;
            box-shadow:0 2px 8px rgba(0,0,0,0.3); flex-shrink:0;
            border:1px solid rgba(255,255,255,0.1);
        }
        #send-btn:hover:not(:disabled) { background:#2a3a2b; }
        #send-btn:active:not(:disabled) { transform:scale(0.92); }
        #send-btn:disabled { background:#333; color:#777; box-shadow:none; cursor:not-allowed; opacity:0.7; }
        #chat-input-bar.locked #chat-input-wrap { background:rgba(40,40,40,0.7); border-color:rgba(255,255,255,0.05); }
        #chat-input-bar.locked .leaf-icon { opacity:0.3; color:#fff; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="top-header">
        <div class="header-left">
            <button class="header-btn" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i></button>
            <div style="display:flex;align-items:center;gap:10px;">
                <img src="Pic/Disease_Detection.png" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">
                <div class="header-info">
                    <h2>Krsi Vaidyah</h2>
                    <p>DharaVeda's AI-Powered Disease Detection</p>
                </div>
            </div>
        </div>
        <button class="header-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <div class="main-content" id="chat-feed">
        <!-- bubbles injected here -->
    </div>

    <!-- hidden file input -->
    <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="onFileChosen(event)">

    <div id="chat-input-bar" class="locked">
        <div id="chat-input-wrap">
            <i class="fa-solid fa-leaf leaf-icon"></i>
            <input id="chat-input" type="text" placeholder="Ask about the disease…" autocomplete="off" disabled onkeydown="handleKey(event)">
        </div>
        <button id="send-btn" onclick="sendChat()" disabled>
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
    ? 'http://127.0.0.1:5000'
    : 'https://dharaveda.onrender.com';

const jwtToken = localStorage.getItem('dharaveda_token') || localStorage.getItem('token') || '';

function getUserName() {
    if (!jwtToken) return 'User';
    try { return JSON.parse(atob(jwtToken.split('.')[1])).name || 'User'; } catch { return 'User'; }
}

// ── state ──────────────────────────────────────────────────────────
const state = { disease: null, confidence: 0, chatHistory: [] };
let lastSender = null;

// ── helpers ────────────────────────────────────────────────────────
const feed = () => document.getElementById('chat-feed');
function scrollBottom() { setTimeout(() => { const f = feed(); f.scrollTop = f.scrollHeight; }, 40); }

function botAvatar(show) {
    return show
        ? `<img class="avatar" src="Pic/Disease_Detection.png" onerror="this.src='Pic/0Logo.png'">`
        : `<div class="avatar-spacer"></div>`;
}
function userAvatar(show) {
    return show
        ? `<img class="avatar" src="Pic/User.png" onerror="this.src='Pic/0Logo.png'">`
        : `<div class="avatar-spacer"></div>`;
}

// Add a bot text bubble, return the bubble element
function addBotBubble() {
    const showAvatar = lastSender !== 'bot';
    lastSender = 'bot';
    const row = document.createElement('div');
    row.className = 'bubble-row';
    row.innerHTML = `${botAvatar(showAvatar)}<div class="bubble bot"></div>`;
    feed().appendChild(row);
    scrollBottom();
    return row.querySelector('.bubble');
}

// Add a user text bubble
function addUserTextBubble(text) {
    const showAvatar = lastSender !== 'user';
    lastSender = 'user';
    const row = document.createElement('div');
    row.className = 'bubble-row user';
    row.innerHTML = `<div class="bubble user">${text}</div>${userAvatar(showAvatar)}`;
    feed().appendChild(row);
    scrollBottom();
}

// Add a user image bubble
function addUserImageBubble(src) {
    const showAvatar = lastSender !== 'user';
    lastSender = 'user';
    const row = document.createElement('div');
    row.className = 'bubble-row user';
    row.innerHTML = `<div class="bubble user-img"><img src="${src}" alt="Uploaded leaf"></div>${userAvatar(showAvatar)}`;
    feed().appendChild(row);
    scrollBottom();
}

// Add loading dots bubble
function addLoadingBubble() {
    const row = document.createElement('div');
    row.className = 'bubble-row';
    row.id = 'loading-bubble';
    row.innerHTML = `<img class="avatar" src="Pic/loading.gif" style="width:38px;height:38px;border-radius:50%;object-fit:cover;">`;
    feed().appendChild(row);
    scrollBottom();
    return row;
}

// Stream text char by char into a bubble element
async function streamInto(el, text, speed = 16) {
    el.textContent = '';
    for (let i = 0; i < text.length; i++) {
        el.textContent += text[i];
        await new Promise(r => setTimeout(r, speed));
        if (i % 30 === 0) scrollBottom();
    }
    scrollBottom();
}

// ── boot ──────────────────────────────────────────────────────────
async function boot() {
    const name = getUserName();

    const b1 = addBotBubble();
    await streamInto(b1, `Namaste ${name}! 🌿`);

    await new Promise(r => setTimeout(r, 350));

    const b2 = addBotBubble();
    await streamInto(b2, "I'm Krsi Vaidyah. Upload a leaf photo and I'll diagnose the disease instantly.");

    await new Promise(r => setTimeout(r, 300));

    // show upload card as a bot "bubble" wrapper
    const showAvatar = lastSender !== 'bot';
    lastSender = 'bot';
    const uploadRow = document.createElement('div');
    uploadRow.className = 'bubble-row';
    uploadRow.innerHTML = `
        ${botAvatar(showAvatar)}
        <div style="flex:1;max-width:82%;">
            <div class="upload-card">
                <h3><i class="fa-solid fa-leaf"></i> Upload Leaf Image</h3>
                <p>Clear, well-lit photo of a single leaf works best.</p>
                <div class="upload-area" id="upload-area"
                    onclick="document.getElementById('file-input').click()"
                    ondragover="event.preventDefault();this.classList.add('drag-over')"
                    ondragleave="this.classList.remove('drag-over')"
                    ondrop="onDrop(event)">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <p>Tap to upload or drag &amp; drop</p>
                </div>
            </div>
        </div>`;
    feed().appendChild(uploadRow);
    scrollBottom();
}

// ── file handling ──────────────────────────────────────────────────
function onDrop(e) {
    e.preventDefault();
    document.getElementById('upload-area').classList.remove('drag-over');
    const file = e.dataTransfer?.files?.[0];
    if (file && file.type.startsWith('image/')) processFile(file);
}

function onFileChosen(e) {
    const file = e.target.files[0];
    if (file) processFile(file);
}

function processFile(file) {
    // Hide upload card row
    document.getElementById('upload-area').closest('.bubble-row').remove();

    const reader = new FileReader();
    reader.onload = async ev => {
        const imgSrc = ev.target.result;
        // Show user image bubble
        addUserImageBubble(imgSrc);
        // Auto-submit
        await analyseImage(file, imgSrc);
    };
    reader.readAsDataURL(file);
}

// ── analyse ────────────────────────────────────────────────────────
async function analyseImage(file, imgSrc) {
    const loader = addLoadingBubble();

    const formData = new FormData();
    formData.append('image', file);

    let data;
    try {
        const resp = await fetch(`${API_BASE}/api/disease_detect`, { method:'POST', body:formData });
        data = await resp.json();
    } catch {
        loader.remove();
        const b = addBotBubble();
        await streamInto(b, '⚠️ Could not reach the server. Check your connection and try again.');
        return;
    }

    loader.remove();

    if (!data.success) {
        const b = addBotBubble();
        await streamInto(b, `⚠️ ${data.error || 'Could not analyse the image. Please try a clearer photo.'}`);
        return;
    }

    // Save state
    state.disease = data.disease;
    state.confidence = data.confidence;

    // Render compact diagnosis card
    renderDiagCard(data, imgSrc);

    await new Promise(r => setTimeout(r, 400));

    // Stream 3 info messages then unlock chat
    await streamInfoMessages(data.disease, data.confidence);
}

// ── compact diag card ──────────────────────────────────────────────
function renderDiagCard(data, imgSrc) {
    const showAvatar = lastSender !== 'bot';
    lastSender = 'bot';

    const pct = Math.min(100, Math.max(0, data.confidence || 0));
    const col = pct >= 70 ? '#22c55e' : pct >= 40 ? '#f59e0b' : '#ef4444';
    const name = (data.disease || 'Unknown').replace(/___/g, ' — ').replace(/_/g, ' ');
    const imgURL = data.heatmap_base64 ? `data:image/jpeg;base64,${data.heatmap_base64}` : imgSrc;

    const row = document.createElement('div');
    row.className = 'bubble-row';
    row.innerHTML = `
        ${botAvatar(showAvatar)}
        <div class="diag-card" style="flex:1;max-width:82%;">
            <div class="diag-row">
                <div class="diag-img"><img src="${imgURL}" alt="leaf heatmap"></div>
                <div class="diag-info">
                    <div class="diag-label">Diagnosed Disease</div>
                    <div class="diag-name">${name}</div>
                    <div class="diag-bar-track">
                        <div class="diag-bar-fill" id="conf-fill" style="width:0%;background:${col};"></div>
                    </div>
                    <span class="diag-pct" style="color:${col};">${pct.toFixed(2)}%</span>
                </div>
            </div>
            <div class="diag-footer"><i class="fa-solid fa-circle-info"></i> Consult a local agronomist for confirmation.</div>
        </div>`;
    feed().appendChild(row);
    scrollBottom();

    setTimeout(() => {
        const f = document.getElementById('conf-fill');
        if (f) f.style.width = pct + '%';
    }, 300);
}

// ── stream 3 info messages via SSE ────────────────────────────────
async function streamInfoMessages(disease, confidence) {
    // We'll collect section content from the stream then present as 3 sequential chat bubbles
    const sections = { description: '', symptoms: '', cause: '', treatment: '', prevention: '' };

    try {
        const resp = await fetch(`${API_BASE}/api/disease_info_stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ disease, confidence })
        });
        if (!resp.ok) throw new Error('stream failed');

        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const raw = line.slice(6).trim();
                if (raw === '[DONE]') break;
                try {
                    const ev = JSON.parse(raw);
                    if (sections.hasOwnProperty(ev.section)) sections[ev.section] = ev.content || '';
                } catch {}
            }
        }
    } catch {
        // fallbacks already handled by backend; sections may be empty strings
    }

    // ── Message 1: About the disease (description + cause) ───────
    const aboutText = buildAboutText(disease, sections.description, sections.cause);
    const b1 = addBotBubble();
    await streamInto(b1, aboutText, 14);
    await new Promise(r => setTimeout(r, 500));

    // ── Message 2: Symptoms ───────────────────────────────────────
    const sympText = buildSymptomsText(sections.symptoms);
    const b2 = addBotBubble();
    await streamInto(b2, sympText, 14);
    await new Promise(r => setTimeout(r, 500));

    // ── Message 3: Treatment & prevention ────────────────────────
    const treatText = buildTreatmentText(sections.treatment, sections.prevention);
    const b3 = addBotBubble();
    await streamInto(b3, treatText, 14);
    await new Promise(r => setTimeout(r, 600));

    // ── Unlock chat ───────────────────────────────────────────────
    unlockChat(disease);
}

function buildAboutText(disease, desc, cause) {
    const name = disease.replace(/___/g, ' — ').replace(/_/g, ' ');
    let out = `🔬 About ${name}\n\n`;
    if (desc) out += desc.trim();
    if (cause) out += `\n\nCause: ${cause.trim()}`;
    return out;
}

function buildSymptomsText(symptoms) {
    let out = `🩺 Symptoms\n\n`;
    if (symptoms) {
        // normalise bullets
        const lines = symptoms.split('\n').map(l => l.trim()).filter(Boolean);
        out += lines.map(l => l.startsWith('•') || l.startsWith('-') ? l : `• ${l}`).join('\n');
    } else {
        out += 'Symptoms data not available.';
    }
    return out;
}

function buildTreatmentText(treatment, prevention) {
    let out = `💊 Treatment & Prevention\n\n`;
    if (treatment) {
        const lines = treatment.split('\n').map(l => l.trim()).filter(Boolean);
        out += lines.map(l => l.startsWith('•') || l.startsWith('-') ? l : `• ${l}`).join('\n');
    }
    if (prevention) {
        out += '\n\nPrevention:\n';
        const lines = prevention.split('\n').map(l => l.trim()).filter(Boolean);
        out += lines.map(l => l.startsWith('•') || l.startsWith('-') ? l : `• ${l}`).join('\n');
    }
    if (!treatment && !prevention) out += 'Treatment data not available.';
    return out;
}

// ── unlock chat ────────────────────────────────────────────────────
function unlockChat(disease) {
    const bar = document.getElementById('chat-input-bar');
    const inp = document.getElementById('chat-input');
    const btn = document.getElementById('send-btn');
    bar.classList.remove('locked');
    inp.disabled = false;
    btn.disabled = false;
    inp.focus();

    const name = disease.replace(/___/g, ' — ').replace(/_/g, ' ');
    setTimeout(async () => {
        const b = addBotBubble();
        await streamInto(b, `You can now ask me anything about ${name} — treatment, prevention, spread, or management. I'll keep answers focused on this disease.`);
    }, 300);
}

// ── chat send ──────────────────────────────────────────────────────
function handleKey(e) { if (e.key === 'Enter') sendChat(); }

async function sendChat() {
    const inp = document.getElementById('chat-input');
    const btn = document.getElementById('send-btn');
    const text = inp.value.trim();
    if (!text) return;

    inp.value = '';
    inp.disabled = true;
    btn.disabled = true;

    addUserTextBubble(text);

    const diseaseName = state.disease
        ? state.disease.replace(/___/g, ' - ').replace(/_/g, ' ')
        : 'the diagnosed disease';

    // System prompt — strict, on-topic only
    const systemPrompt = `You are Krsi Vaidyah, a plant disease expert in the DharaVeda app. The plant was diagnosed with "${diseaseName}" at ${state.confidence.toFixed(1)}% confidence.

Rules you MUST follow:
1. Only answer questions directly related to this disease, its symptoms, causes, treatment, prevention, or crop/plant management related to it.
2. If the user asks anything unrelated to this disease or plant/crop topics, reply with exactly: "I can only help with questions about ${diseaseName} and related crop health topics."
3. Keep replies short and precise — 2 to 4 sentences maximum. Never pad the answer.
4. Do not use markdown. Plain text only.
5. Do not introduce yourself. You are already in a conversation.`;

    if (state.chatHistory.length === 0) {
        state.chatHistory.push({ role: 'system', content: systemPrompt });
    }
    state.chatHistory.push({ role: 'user', content: text });

    // loading
    const loader = addLoadingBubble();

    try {
        const resp = await fetch(`${API_BASE}/api/ai_chat_stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages: state.chatHistory })
        });

        loader.remove();
        lastSender = null;
        const bubble = addBotBubble();

        if (!resp.ok) throw new Error('failed');

        const reader = resp.body.getReader();
        const dec = new TextDecoder();
        let buf = '', reply = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const token = line.slice(6);
                if (token === '[DONE]') break;
                if (token.startsWith('[ERROR]')) { bubble.textContent = 'An error occurred. Please try again.'; break; }
                reply += token;
                bubble.textContent = reply;
                scrollBottom();
            }
        }

        state.chatHistory.push({ role: 'assistant', content: reply });

    } catch {
        loader.remove();
        const b = addBotBubble();
        b.textContent = '⚠️ Could not connect. Please try again.';
    }

    inp.disabled = false;
    btn.disabled = false;
    inp.focus();
    scrollBottom();
}

// ── start ──────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
