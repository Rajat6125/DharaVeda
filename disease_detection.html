<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DharaVeda - Disease Detection</title>
    <link rel="icon" href="Pic/0Logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --text-primary: #1E2A1F;
            --text-secondary: #555555;
            --accent-green: #3B6B3F;
            --light-green: #E8F5E9;
            --font-family: 'Outfit', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            height: 100%;
            height: 100dvh;
        }
        body {
            font-family: var(--font-family);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            background-color: #f4f4f4;
            overflow: hidden;
        }
        body::before {
            content:'';
            position:fixed; top:0; left:0;
            width:100%; height:100%;
            background-image: url('Pic/Wall1.jpg'); /* Using same background as crop recommend for consistency */
            background-size:cover; background-position:center;
            z-index:-1;
        }
        .app-container {
            width:100%; max-width:480px;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0);
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(2px);
            position:relative; display:flex; flex-direction:column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .top-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:16px 20px;
            background: rgba(255,255,255,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.5);
            z-index:10; flex-shrink: 0; position: sticky; top: 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom-left-radius:20px; border-bottom-right-radius:20px;
        }
        .header-left { display:flex; align-items:center; gap:12px; }
        .header-info h2 { font-size:18px; font-weight:700; color:var(--accent-green); }
        .header-info p { font-size:12px; color:var(--text-secondary); }
        .header-right { display:flex; gap:16px; }
        .header-btn { background:none; border:none; font-size:18px; color:var(--text-secondary); cursor:pointer; }
        
        .main-content {
            flex: 1; min-height: 0; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
        }
        .main-content::-webkit-scrollbar { width:6px; }
        .main-content::-webkit-scrollbar-thumb { background:rgba(0,0,0,0.1); border-radius:10px; }
        
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        
        .form-card {
            background:rgba(240,248,241,0.95); border-radius:20px; padding:20px;
            box-shadow:0 4px 15px rgba(0,0,0,0.05); border:1px solid rgba(255,255,255,0.5);
            animation:fadeIn 0.3s ease; width:100%; text-align: center;
        }
        
        .upload-area {
            border: 2px dashed rgba(59,107,63,0.3);
            border-radius: 16px;
            padding: 40px 20px;
            margin: 20px 0;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: var(--accent-green);
            background: #f8fff8;
        }
        .upload-area i {
            font-size: 40px;
            color: var(--accent-green);
            margin-bottom: 12px;
        }
        .upload-area p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        #image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 12px;
            display: none;
            margin: 15px 0;
            background: #000;
        }
        
        .submit-btn {
            width:100%; background:var(--accent-green); color:white; border:none;
            padding:12px; border-radius:12px; font-size:14px; font-weight:600;
            font-family:var(--font-family); cursor:pointer;
            display:flex; justify-content:center; align-items:center; gap:8px; transition:background 0.2s;
        }
        .submit-btn:hover { background:#2D5230; }
        .submit-btn:disabled { background:#000000; color:#4ade80; cursor:not-allowed; }
        
        /* Result card */
        .result-card {
            background: white; border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); animation: fadeIn 0.4s ease;
            display: none;
        }
        .heatmap-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .ai-details-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            border: 1px solid #eee;
            text-align: left;
        }
        .disease-title {
            font-size: 18px;
            font-weight: 700;
            color: #c62828;
            margin-bottom: 5px;
        }
        .confidence-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
        }
        .reupload-btn {
            margin-top: 15px;
            background: #f1f8e9;
            color: var(--accent-green);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }
        .loading-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 30px 20px;
            background: white;
            border-radius: 16px;
            margin-top: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            animation: fadeIn 0.3s ease;
        }
        .loading-overlay.visible { display: flex; }
        .spinner {
            width: 44px; height: 44px;
            border: 4px solid #e8f5e9;
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--text-secondary); font-weight: 500; text-align: center; }
        .loading-subtext { font-size: 12px; color: #aaa; text-align: center; }

        /* Chat styles */
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .msg-bubble p { margin-bottom: 8px; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble strong { font-weight: 600; color: #111; }
        .msg-bubble ul, .msg-bubble ol { margin: 8px 0; padding-left: 20px; }
        .msg-bubble li { margin-bottom: 4px; }
        
        .msg-user {
            background: #f97316;
            color: #ffffff;
            border-bottom-right-radius: 0;
            margin-left: auto;
        }
        .msg-bot {
            background: #ffffff;
            color: var(--text-primary);
            border-top-left-radius: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* AI Chat input bar */
        #chat-input-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px 14px;
            background: transparent;
            border-top: none;
            flex-shrink: 0;
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        #chat-input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(30, 42, 31, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 10px 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.2s;
        }
        #chat-input-wrap:focus-within {
            border-color: #4ade80;
            box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.2);
        }
        #chat-input-wrap .chat-leaf-icon { font-size: 14px; color: #4ade80; opacity: 0.9; flex-shrink: 0; }
        #chat-input {
            flex: 1; border: none; background: transparent; font-size: 13px;
            font-family: var(--font-family); outline: none; color: #ffffff; min-width: 0;
        }
        #chat-input::placeholder { color: rgba(255, 255, 255, 0.6); }
        #chat-input:disabled { cursor: not-allowed; }
        
        #chat-send-btn {
            width: 42px; height: 42px;
            border-radius: 50%; border: none;
            background: #1E2A1F; color: #4ade80; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #chat-send-btn:hover:not(:disabled) { background: #2a3a2b; }
        #chat-send-btn:disabled { background: #333333; color: #777777; box-shadow: none; cursor: not-allowed; opacity: 0.7; }
        
        #chat-input-bar.locked #chat-input-wrap {
            background: rgba(40, 40, 40, 0.7);
            border-color: rgba(255, 255, 255, 0.05);
        }
        #chat-input-bar.locked .chat-leaf-icon { opacity: 0.3; color: #ffffff; }

        /* Output Card styles */
        .diag-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: left; margin-bottom: 10px; width: 100%; animation: fadeIn 0.4s ease; }
        .diag-header { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .diag-header i { color: var(--accent-green); font-size: 24px; }
        .diag-header h2 { color: #1a4d2e; font-size: 20px; font-weight: 700; margin: 0; }
        .diag-sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
        
        .diag-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
        .diag-img-box { width: 100%; }
        .diag-img-box img { width: 100%; border-radius: 12px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .diag-info { width: 100%; }
        .diag-label { color: #777; font-size: 12px; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .diag-title { color: #1a4d2e; font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        .diag-conf-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .diag-conf-bar { flex: 1; background: #e0e0e0; height: 8px; border-radius: 4px; overflow: hidden; }
        .diag-conf-fill { background: #3b6b3f; height: 100%; transition: width 1s ease; }
        .diag-conf-text { font-size: 14px; font-weight: 700; color: #3b6b3f; }
        .diag-desc { color: #555; font-size: 13px; line-height: 1.5; }
        
        .diag-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .diag-icon-box { width: 28px; height: 28px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent-green); font-size: 12px; }
        .diag-section-title { color: #1a4d2e; font-size: 16px; margin: 0; font-weight: 700; }
        .diag-list { color: #444; font-size: 13px; line-height: 1.6; padding-left: 36px; }
        .diag-list ul { margin: 0; padding-left: 15px; }
        .diag-list li { margin-bottom: 6px; }
        
        .diag-footer { display: flex; align-items: center; gap: 8px; color: #888; font-size: 11px; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="top-header">
        <div class="header-left">
            <button class="header-btn" onclick="window.history.back()"><i class="fa-solid fa-arrow-left"></i></button>
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="Pic/Disease_Detection.png" alt="Disease Detection" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;">
                <div class="header-info">
                    <h2>Krsi Vaidyah</h2>
                    <p>DharaVeda's AI-Powered Plant Disease Detection</p>
                </div>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
    </div>
    
    <div class="main-content">
        <!-- Pre-recommendation bot greeting messages -->
        <div id="chat-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
        
        <div class="form-card" id="upload-card" style="display: none;">
            <h3 style="color: var(--accent-green); margin-bottom: 8px;">Upload Leaf Image</h3>
            <p style="font-size: 12px; color: var(--text-secondary);">For best results, upload a clear, well-lit image of a single leaf.</p>
            
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="previewImage(event)">
            <div class="upload-area" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <p>Tap to upload an image</p>
            </div>
            
            <img id="image-preview" src="" alt="Preview">
            
            <button class="submit-btn" id="submit-btn" onclick="submitImage()" style="display: none;">
                <i class="fa-solid fa-magnifying-glass"></i> Analyze Disease
            </button>
        </div>
        
        <!-- Loading state -->
        <div class="loading-overlay" id="loading-overlay" style="display: none; width: 100%;">
            <div class="spinner"></div>
            <div class="loading-text">Analyzing your leaf image...</div>
            <div class="loading-subtext" id="loading-subtext">Connecting to AI model</div>
        </div>

        <!-- Result Card and AI chat container -->
        <div id="result-container" style="display: none; width: 100%;"></div>
        
        <div id="ai-chat-container" style="display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 12px;"></div>
    </div>
    
    <!-- Chat Input Bar -->
    <div id="chat-input-bar" class="locked">
        <div id="chat-input-wrap">
            <i class="fa-solid fa-leaf chat-leaf-icon"></i>
            <input type="text" id="chat-input" placeholder="Chat locked until diagnosis..." disabled onkeypress="handleChatEnter(event)">
        </div>
        <button id="chat-send-btn" disabled onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
        ? 'http://127.0.0.1:5000'
        : 'https://dharaveda.onrender.com';

    let selectedFile = null;
    let jwtToken = localStorage.getItem('token') || '';
    
    // Chat state
    const chatState = {
        history: [],
        isStreaming: false,
        diseaseData: null
    };

    window.onload = () => {
        setTimeout(() => addInitialBotMessages(), 300);
    };

    function addInitialBotMessages() {
        appendMessage('bot', "Namaste! 🙏 I am Krsi Vaidyah, your AI Plant Pathologist.", true);
        setTimeout(() => {
            appendMessage('bot', "Upload a photo of a diseased leaf, and I'll identify the issue and suggest treatments.", true);
            setTimeout(() => {
                const uploadCard = document.getElementById('upload-card');
                uploadCard.style.display = 'block';
                uploadCard.style.animation = 'fadeIn 0.5s ease';
                scrollToBottom();
            }, 600);
        }, 800);
    }

    function appendMessage(sender, text, isGreeting = false) {
        const container = isGreeting ? document.getElementById('chat-container') : document.getElementById('ai-chat-container');
        const div = document.createElement('div');
        div.style.cssText = "display: flex; gap: 10px; align-items: flex-start; animation: fadeIn 0.3s ease;";

        if (sender === 'bot') {
            div.innerHTML = `
                <img src="Pic/Disease_Detection.png" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-top: 2px; flex-shrink: 0;">
                <div class="msg-bubble msg-bot">${text}</div>
            `;
        } else {
            div.innerHTML = `
                <div class="msg-bubble msg-user">${text}</div>
            `;
            div.style.justifyContent = "flex-end";
        }
        
        container.appendChild(div);
        scrollToBottom();
    }

    function scrollToBottom() {
        setTimeout(() => {
            document.querySelector('.main-content').scrollTop = document.querySelector('.main-content').scrollHeight;
        }, 50);
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        selectedFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
            const preview = document.getElementById('image-preview');
            preview.src = e.target.result;
            preview.style.display = 'block';
            document.querySelector('.upload-area').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'flex';
            
            // Automatically submit after choosing
            setTimeout(() => submitImage(), 500);
        };
        reader.readAsDataURL(file);
        event.target.value = '';
    }

    function extractSection(text, sectionName) {
        if (!text) return '';
        const regex = new RegExp(sectionName + ':\\s*([\\s\\S]*?)(?=\\n[A-Z][a-z]+:|$)');
        const match = text.match(regex);
        return match ? match[1].trim() : '';
    }

    function formatList(text) {
        if (!text) return 'No details available.';
        const items = text.split('\n').map(line => line.replace(/^[•\-\*]\s*/, '').trim()).filter(Boolean);
        if(items.length === 0) return 'No details available.';
        return '<ul>' + items.map(item => `<li>${item}</li>`).join('') + '</ul>';
    }

    async function submitImage() {
        if (!selectedFile) return;

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.style.display = 'none';

        // Add a chat message for the image upload (true = put in chat-container above the card)
        const previewSrc = document.getElementById('image-preview').src;
        appendMessage('user', `<img src="${previewSrc}" style="max-width: 150px; border-radius: 8px;">`, true);
        
        document.getElementById('upload-card').style.display = 'none';

        // Show spinner
        const overlay = document.getElementById('loading-overlay');
        overlay.style.display = 'flex';
        scrollToBottom();

        const subtextEl = document.getElementById('loading-subtext');
        const slowHintTimer = setTimeout(() => {
            subtextEl.textContent = 'Server is waking up, this may take ~30s…';
        }, 6000);

        const formData = new FormData();
        formData.append('image', selectedFile);

        try {
            const controller = new AbortController();
            const fetchTimeout = setTimeout(() => controller.abort(), 55000);

            const response = await fetch(`${API_BASE}/api/disease_detect`, {
                method: 'POST',
                body: formData,
                signal: controller.signal
            });

            clearTimeout(fetchTimeout);
            clearTimeout(slowHintTimer);
            overlay.style.display = 'none';

            const result = await response.json();

            if (!response.ok || !result.success) {
                appendMessage('bot', `⚠️ Analysis failed: ${result.error || 'Server error'}. Please refresh and try again.`);
                return;
            }

            // ── Success ──────────────────────────────────────────────
            const isHealthy = result.disease.toLowerCase().includes('healthy');
            const formattedDisease = result.disease.replace(/___/g, ' — ').replace(/_/g, ' ');

            chatState.diseaseData = {
                name: formattedDisease,
                isHealthy: isHealthy,
                confidence: result.confidence
            };

            const diagHtml = `
            <div class="diag-card">
                <div class="diag-header">
                    <i class="fa-solid fa-leaf"></i>
                    <h2>Our Diagnosis</h2>
                </div>
                <p class="diag-sub">Based on the provided leaf image, our AI model diagnosed the disease.</p>
                
                <div class="diag-grid" style="display: flex; flex-direction: row; gap: 20px; align-items: flex-start; margin-bottom: 20px;">
                    <div class="diag-img-box" style="flex: 0 0 140px;">
                        <img src="${result.heatmap_base64 ? 'data:image/jpeg;base64,' + result.heatmap_base64 : previewSrc}" style="width: 140px; height: 140px; border-radius: 12px; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.1);" alt="Diagnosis Image">
                    </div>
                    <div class="diag-info" style="flex: 1;">
                        <p class="diag-label">Diagnosed Disease</p>
                        <h3 class="diag-title" style="font-size: 18px;">${formattedDisease}</h3>
                        
                        <div class="diag-conf-row">
                            <div class="diag-conf-bar">
                                <div class="diag-conf-fill" style="width: ${result.confidence}%"></div>
                            </div>
                            <span class="diag-conf-text">${result.confidence}%</span>
                        </div>
                    </div>
                </div>
                
                <hr style="border: none; border-top: 1px solid #eee; margin: 15px 0;">
                
                <div id="card-streaming-content" style="font-size: 14px; color: #444; line-height: 1.6;">
                    <div style="display: flex; align-items: center; gap: 8px; color: #888;">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Generating disease details in real time...
                    </div>
                </div>
                
                <hr style="border: none; border-top: 1px solid #eee; margin: 15px 0;">
                <div class="diag-footer">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>Diagnosis is AI-generated and may vary based on real-time field conditions.</span>
                </div>
            </div>`;

            const resContainer = document.getElementById('result-container');
            resContainer.innerHTML = diagHtml;
            resContainer.style.display = 'block';
            scrollToBottom();

            // Setup Chat Context
            const systemPrompt = `You are Krsi Vaidyah, an expert agricultural AI assistant. You just diagnosed a plant leaf with "${formattedDisease}" (Confidence: ${result.confidence}%).`;
            
            chatState.history = [
                { role: 'system', content: systemPrompt }
            ];

            const detailsPrompt = `Please provide a short description (1-2 sentences) of ${formattedDisease}.
Then, add an empty line and write "**Symptoms**" followed by a bulleted list of the symptoms.
Then, add an empty line and write "**Treatment**" followed by a bulleted list of the treatments.
Ensure the response is properly spaced, easy to read, and very concise.`;
            
            // Stream the details into the card
            await streamCardDetails([{ role: 'system', content: systemPrompt }, { role: 'user', content: detailsPrompt }]);

            // Update history with generated details context
            const generatedDetails = document.getElementById('card-streaming-content').innerHTML;
            chatState.history.push({ role: 'assistant', content: "Diagnosis Details:\n" + generatedDetails });
            
            // Setup follow-up chat
            const followUpPrompt = `I have received the diagnosis details for ${formattedDisease}. Please provide a very brief comforting response (1 sentence max) and then ask: "Do you have any other concerns regarding the diagnosis or diseases?"`;

            // Use the AI API to stream the follow-up response in chat bubbles
            await streamAIResponse([{ role: 'system', content: systemPrompt }, { role: 'user', content: followUpPrompt }]);
            
            showChatInput();
            scrollToBottom();

        } catch (err) {
            clearTimeout(slowHintTimer);
            overlay.style.display = 'none';
            appendMessage('bot', '⚠️ Could not reach the server. Please try again later.');
        }
    }

    function showChatInput() {
        const bar = document.getElementById('chat-input-bar');
        const input = document.getElementById('chat-input');
        const btn = document.getElementById('chat-send-btn');
        if (bar) bar.classList.remove('locked');
        if (input) { input.disabled = false; input.placeholder = 'Ask about the diagnosis…'; input.focus(); }
        if (btn) btn.disabled = false;
    }

    function handleChatEnter(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendChatMessage();
        }
    }

    async function sendChatMessage() {
        if (chatState.isStreaming) return;
        const input = document.getElementById('chat-input');
        const msg = input.value.trim();
        if (!msg) return;

        input.value = '';
        appendMessage('user', msg);
        chatState.history.push({ role: 'user', content: msg });

        await streamAIResponse(chatState.history);
    }

    function renderMarkdown(text) {
        if (!text) return '';
        let html = text;
        html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
        html = html.replace(/\n/g, '<br>');
        return html;
    }

    // Removed simulateAIStream since we now use streamAIResponse for the follow-up message

    async function streamCardDetails(messages) {
        const container = document.getElementById('card-streaming-content');
        if (!container) return;
        
        try {
            const headers = { 'Content-Type': 'application/json' };
            if (jwtToken) headers['Authorization'] = `Bearer ${jwtToken}`;

            const response = await fetch(`${API_BASE}/api/ai_chat_stream`, {
                method: 'POST',
                headers,
                body: JSON.stringify({ messages })
            });

            if (!response.ok) throw new Error('HTTP ' + response.status);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';

            outer: while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                while (buffer.includes('\n')) {
                    const idx = buffer.indexOf('\n');
                    const line = buffer.substring(0, idx).trim();
                    buffer = buffer.substring(idx + 1);

                    if (line.startsWith('data: ')) {
                        const token = line.substring(6);
                        if (token === '[DONE]') break outer;
                        if (token.startsWith('[ERROR]')) break outer;

                        fullText += token;
                        container.innerHTML = renderMarkdown(fullText);
                        scrollToBottom();
                    }
                }
            }
        } catch (err) {
            container.innerHTML = 'Details could not be generated at this time.';
        }
    }

    async function streamAIResponse(messages) {
        chatState.isStreaming = true;
        const sendBtn = document.getElementById('chat-send-btn');
        if (sendBtn) sendBtn.disabled = true;

        const headers = { 'Content-Type': 'application/json' };
        if (jwtToken) headers['Authorization'] = `Bearer ${jwtToken}`;

        let fullReply = '';

        const containerId = 'ai-chat-container';
        const msgDiv = document.createElement('div');
        msgDiv.style.cssText = "display: flex; gap: 10px; align-items: flex-start; animation: fadeIn 0.3s ease;";
        msgDiv.innerHTML = `
            <img id="ai-thinking-avatar" src="Pic/loading.gif" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-top: 2px; flex-shrink: 0;">
            <div class="msg-bubble msg-bot" style="background: white; padding: 10px 14px; border-radius: 12px; border-top-left-radius: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 13px; line-height: 1.5; color: var(--text-primary); max-width: 85%;"></div>
        `;
        document.getElementById(containerId).appendChild(msgDiv);
        scrollToBottom();
        
        let activeBubble = msgDiv.querySelector('.msg-bubble');
        let avatarSwapped = false;

        try {
            const response = await fetch(`${API_BASE}/api/ai_chat_stream`, {
                method: 'POST',
                headers,
                body: JSON.stringify({ messages })
            });

            if (!response.ok) throw new Error('HTTP ' + response.status);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let tokenBuffer = '';

            outer: while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                while (buffer.includes('\n')) {
                    const idx = buffer.indexOf('\n');
                    const line = buffer.substring(0, idx).trim();
                    buffer = buffer.substring(idx + 1);

                    if (line.startsWith('data: ')) {
                        const token = line.substring(6);
                        if (token === '[DONE]') break outer;
                        if (token.startsWith('[ERROR]')) {
                            activeBubble.textContent = 'Sorry, the AI service is currently unavailable.';
                            break outer;
                        }

                        if (!avatarSwapped) {
                            avatarSwapped = true;
                            const thinkingAvatar = document.getElementById('ai-thinking-avatar');
                            if (thinkingAvatar) {
                                thinkingAvatar.src = 'Pic/Disease_Detection.png';
                                thinkingAvatar.removeAttribute('id');
                            }
                        }

                        fullReply += token;
                        tokenBuffer += token;

                        const hasSentenceEnd = /[.!?\n]/.test(tokenBuffer);
                        const isLongEnough = tokenBuffer.trim().length >= 60;

                        if (hasSentenceEnd && isLongEnough) {
                            const breakMatch = tokenBuffer.match(/^([\s\S]*[.!?\n])\s*/);
                            if (breakMatch) {
                                const chunkText = renderMarkdown(breakMatch[1]);
                                const remainder = tokenBuffer.substring(breakMatch[0].length);

                                activeBubble.innerHTML = chunkText;
                                scrollToBottom();

                                await new Promise(r => setTimeout(r, 200));

                                const nextDiv = document.createElement('div');
                                nextDiv.style.cssText = "display: flex; gap: 10px; align-items: flex-start; animation: fadeIn 0.3s ease;";
                                nextDiv.innerHTML = `
                                    <div style="width: 32px; height: 32px; flex-shrink: 0;"></div>
                                    <div class="msg-bubble msg-bot" style="background: white; padding: 10px 14px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-size: 13px; line-height: 1.5; color: var(--text-primary); max-width: 85%;"></div>
                                `;
                                document.getElementById(containerId).appendChild(nextDiv);
                                scrollToBottom();
                                
                                activeBubble = nextDiv.querySelector('.msg-bubble');
                                tokenBuffer = remainder;
                            } else {
                                activeBubble.innerHTML = renderMarkdown(tokenBuffer);
                            }
                        } else {
                            activeBubble.innerHTML = renderMarkdown(tokenBuffer);
                            scrollToBottom();
                        }
                    }
                }
            }

            if (tokenBuffer.trim()) {
                activeBubble.innerHTML = renderMarkdown(tokenBuffer);
                scrollToBottom();
            } else if (!activeBubble.innerHTML.trim()) {
                activeBubble.closest('div').remove();
            }

        } catch (err) {
            activeBubble.textContent = 'Sorry, I couldn\'t connect. Please try again.';
        } finally {
            chatState.isStreaming = false;
            if (fullReply) chatState.history.push({ role: 'assistant', content: fullReply });
            if (sendBtn) sendBtn.disabled = false;
            const chatInput = document.getElementById('chat-input');
            if (chatInput) chatInput.focus();
        }
        return fullReply;
    }
</script>
